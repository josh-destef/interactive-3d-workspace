<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Gizmobot Hierarchy - CreateAccess</title>
    <meta name="description" content="Move Gizmobot’s arm and discover how connected parts follow each other." />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>" />
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css?v=selector5" />
</head>

<body>
    <div id="app">
        <a href="../../../" class="home-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
            </svg>
            <span>Home</span>
        </a>

        <img src="assets/Logo.png" alt="CreateAccess Logo" class="logo-top-right">

        <div id="util-bar">
            <button type="button" class="util-btn" id="btn-reset-view">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
                Reset View
            </button>
        </div>

        <!-- canvas window -->
        <div id="canvas-wrap">
            <canvas id="cv"></canvas>
            <div id="catch-feedback" role="status" aria-live="polite" hidden></div>
            <div id="prog">
                <div id="prog-fill"></div>
            </div>
            <div id="status-badge">
                <span class="badge-dot"></span>
                <span class="badge-text">Watch</span>
            </div>
            <!-- replay-demo button: sits under the "Your Turn" badge so a student
                 who missed the demo can re-watch it -->


            <div id="loading">loading Gizmobot’s arm...</div>

            <!-- demo cursor (pixel-art pointer; each subpath is one run of pixels) -->
            <div id="demo-cursor">
                <svg id="cursor-arrow" width="22" height="30" viewBox="0 0 11 15" shape-rendering="crispEdges">
                    <path fill="#1a1a2e"
                        d="M0 0h1v1h-1z M0 1h2v1h-2z M0 2h1v1h-1z M2 2h1v1h-1z M0 3h1v1h-1z M3 3h1v1h-1z M0 4h1v1h-1z M4 4h1v1h-1z M0 5h1v1h-1z M5 5h1v1h-1z M0 6h1v1h-1z M6 6h1v1h-1z M0 7h1v1h-1z M7 7h1v1h-1z M0 8h1v1h-1z M8 8h1v1h-1z M0 9h1v1h-1z M9 9h1v1h-1z M0 10h1v1h-1z M6 10h5v1h-5z M0 11h1v1h-1z M3 11h1v1h-1z M6 11h1v1h-1z M0 12h1v1h-1z M2 12h1v1h-1z M4 12h1v1h-1z M7 12h1v1h-1z M0 13h2v1h-2z M4 13h1v1h-1z M7 13h1v1h-1z M5 14h2v1h-2z" />
                    <path fill="#ffffff"
                        d="M1 2h1v1h-1z M1 3h2v1h-2z M1 4h3v1h-3z M1 5h4v1h-4z M1 6h5v1h-5z M1 7h6v1h-6z M1 8h7v1h-7z M1 9h8v1h-8z M1 10h5v1h-5z M1 11h2v1h-2z M4 11h2v1h-2z M1 12h1v1h-1z M5 12h2v1h-2z M5 13h2v1h-2z" />
                </svg>
            </div>
        </div>

        <!-- info panel -->
        <div id="panel">
            <div class="panel-header">
                <div id="cap-step"></div>
                <div id="cap-title"></div>
            </div>
            <div id="cap-body"></div>
            <div class="panel-footer">
                <div class="continue-side">
                    <button type="button" id="btn-replay">Show me</button>
                    <a id="btn-finish" href="../../../">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        Back to Home
                    </a>
                    <p id="try-hint" hidden></p>
                    <button type="button" id="btn-continue">
                        Continue
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                            <path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <div id="kbd-hint"><kbd>Space</kbd> to continue</div>
                </div>
            </div>
        </div>

        <!-- control dock: starts empty, grows one control per step -->
        <div id="dock">
            <ol id="connection-strip" aria-label="Shoulder connects to elbow, elbow to wrist, wrist to the three fingers">
                <li data-chain="shoulder">Shoulder</li><li data-chain="elbow">Elbow</li><li data-chain="wrist">Wrist</li><li data-chain="fingers">Fingers</li>
            </ol>
            <div id="highlight-key"><span></span>Highlighted parts follow your rotation</div>
            <div class="dock-heading">Choose a part</div>
            <div id="part-picker" aria-label="Select a part of Gizmobot's arm">
                <canvas id="selector-canvas" aria-label="Click an arm segment to select it"></canvas>
                <svg id="selector-lines" aria-hidden="true"></svg>
                <div id="selector-labels"></div>
            </div>
            <p class="selector-hint">Choose a label or tap the small arm</p>
            <div id="selected-part">Shoulder</div>
            <div class="dock-row" id="movement-sliders"></div>
            <div class="ctl on" id="grip-control">
                <label class="ctl-label" for="slider-grip">Close the hand</label>
                <input id="slider-grip" type="range" min="0" max="100" value="0" aria-label="Hand grip">
                <div class="ctl-ends"><span>open</span><span>closed</span></div>
            </div>
            <button type="button" id="btn-reach-help" class="dock-action" hidden>Bring the hand near the block</button>
            <div id="pose-presets" hidden aria-label="Poses"></div>
            <button type="button" id="btn-reset-pose" class="dock-action">Reset pose</button>
        </div>

    </div>

    <script type="importmap">{"imports":{
  "three":          "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
}}</script>
    <script type="module" src="js/main.js?v=selector5"></script>
</body>

</html>
