<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Gizmobot's Back Unit - CreateAccess</title>
    <meta name="description"
        content="Invent a Back Unit for Gizmobot by combining, reshaping and colouring simple shapes." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <!-- the kit first, this lab's own overrides second -->
    <link rel="stylesheet" href="../../kit/css/kit.css" />
    <link rel="stylesheet" href="css/lab.css" />
</head>

<body>
    <div id="app">

        <!-- ══ canvas window ══ -->
        <div id="canvas-wrap">
            <canvas id="cv" tabindex="0" aria-label="3D modelling viewport. Use the visible toolbars to select tools, then drag their handles on the model."></canvas>

            <div id="prog">
                <div id="prog-fill"></div>
            </div>

            <div id="tool-stack" aria-label="Workbench tools">
        <a href="../../../" class="home-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
            </svg>
            <span>Home</span>
        </a>

            <!-- ══ tool rail ══
                 Viewport chrome that holds tools as they are introduced. -->
            <div id="rail" role="toolbar" aria-label="Modelling tools" aria-orientation="vertical">
                <div class="rail-group">
                    <button class="rail-btn" data-tool="select" type="button" aria-pressed="true"
                        title="Select" aria-label="Select">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 3 L6 19 L10 15 L13 21 L16 20 L13 14 L18 14 Z" />
                        </svg>
                        <span class="rail-tip">Select</span>
                    </button>
                    <button class="rail-btn" data-tool="move" type="button" aria-pressed="false"
                        title="Move (G)" aria-label="Move">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke">
                            <path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" />
                        </svg>
                        <span class="rail-tip">Move <kbd>G</kbd></span>
                    </button>
                    <button class="rail-btn" data-tool="rotate" type="button" aria-pressed="false"
                        title="Rotate (R)" aria-label="Rotate">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke">
                            <path d="M5 13a7 7 0 1 1 3 5" />
                            <path d="M4 6l1 6 6-1" />
                        </svg>
                        <span class="rail-tip">Rotate <kbd>R</kbd></span>
                    </button>
                    <button class="rail-btn" data-tool="scale" type="button" aria-pressed="false"
                        title="Scale (S)" aria-label="Scale">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke">
                            <rect x="4" y="10" width="10" height="10" />
                            <path d="M10 8V4h10v10h-4" />
                        </svg>
                        <span class="rail-tip">Scale <kbd>S</kbd></span>
                    </button>
                </div>

                <div class="rail-group">
                    <button class="rail-btn" data-tool="duplicate" type="button"
                        title="Duplicate (Shift+D)" aria-label="Duplicate">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke">
                            <rect x="4" y="8" width="11" height="12" />
                            <path d="M8 5h11v12" />
                        </svg>
                        <span class="rail-tip">Duplicate <kbd>Shift</kbd><kbd>D</kbd></span>
                    </button>
                </div>

                <div class="rail-group">
                    <button class="rail-btn" data-tool="undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke">
                            <path d="M4 9h11a5 5 0 0 1 0 10h-6" />
                            <path d="M8 5L4 9l4 4" />
                        </svg>
                        <span class="rail-tip">Undo <kbd>Ctrl</kbd><kbd>Z</kbd></span>
                    </button>
                    <button class="rail-btn" data-tool="redo" type="button" title="Redo (Ctrl+Shift+Z)"
                        aria-label="Redo">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke">
                            <path d="M20 9H9a5 5 0 0 0 0 10h6" />
                            <path d="M16 5l4 4-4 4" />
                        </svg>
                        <span class="rail-tip">Redo <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>Z</kbd></span>
                    </button>
                </div>
            </div>
            <!-- The three core transforms stay visible together, like the
                 controls introduced in Navigate + Transform.  The remaining
                 modelling tools continue to appear in #rail as they are
                 taught. -->
            <div id="transform-bar" role="toolbar" aria-label="Transform tools" aria-orientation="vertical">
                <button class="transform-btn" data-tool="move" type="button" aria-pressed="false" title="Move">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" /></svg>
                    <span>Move</span>
                </button>
                <button class="transform-btn" data-tool="rotate" type="button" aria-pressed="false" title="Rotate">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke"><path d="M5 13a7 7 0 1 1 3 5" /><path d="M4 6l1 6 6-1" /></svg>
                    <span>Rotate</span>
                </button>
                <button class="transform-btn" data-tool="scale" type="button" aria-pressed="false" title="Scale">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke"><rect x="4" y="10" width="10" height="10" /><path d="M10 8V4h10v10h-4" /></svg>
                    <span>Scale</span>
                </button>
            </div>

        <div id="util-bar">
            <button class="util-btn" id="btn-reset-view" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
                Reset view
            </button>
        </div>

            </div>

            <!-- ══ object list ══
                 Selection is two-way: click a row or click the object. The
                 transform block reports; it is not how you transform. -->
            <div id="outliner">
                <div class="out-head">Pieces</div>
                <div id="out-rows" role="listbox" aria-label="Pieces in the scene" aria-multiselectable="true"></div>
                <div id="out-empty">Nothing here yet.<br>Add a cube to begin.</div>
                <div id="out-xform" hidden>
                    <div class="xf-row"><span>size</span><b data-xf="size">-</b></div>
                    <div class="xf-row"><span>pos</span><b data-xf="pos">-</b></div>
                    <div class="xf-row"><span>rot</span><b data-xf="rot">-</b></div>
                </div>
            </div>

            <!-- live value for whatever is being dragged; the only numeric
                 feedback in the lab, and it lives with the action -->
            <div id="modal-readout" aria-live="polite"></div>

            <div id="loading">Getting the workbench ready...</div>
        </div>

        <!-- ══ the closing quiz ══ -->
        <div id="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
            <div class="quiz-head">
                <h2 id="quiz-title">Check what you learned</h2>
                <span id="quiz-tally"></span>
            </div>
            <div id="quiz-list"></div>
        </div>

        <!-- ══ the Read card ══ -->
        <div id="read-layer">
            <div id="read-card" role="dialog" aria-modal="true" aria-labelledby="read-title">
                <div id="read-step"></div>
                <h2 id="read-title"></h2>
                <div id="read-body"></div>
                <button id="btn-read-go" type="button"></button>
                <div id="read-hint"><kbd>Space</kbd> or click to continue</div>
            </div>
        </div>

        <!-- ══ the console ══ -->
        <div id="console">

            <div id="panel">
                <div class="panel-header">
                    <div id="cap-step"></div>
                    <div id="cap-title"></div>
                </div>
                <div id="cap-body"></div>

                <div class="panel-footer">
                    <a id="btn-finish" href="../../../">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        Back to Home
                    </a>
                    <div class="continue-side">
                        <button id="btn-continue" type="button">
                            Continue
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.4"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div id="kbd-hint"><kbd>Space</kbd> to continue</div>
                    </div>
                </div>
            </div>

            <!-- ══ the dock ══
                 Buttons and swatches. There is not a single range input in
                 this lab: every value is dragged in the viewport. -->
            <div id="dock">
                <div class="dock-row">

                    <div class="ctl" data-group="add">
                        <div class="ctl-label">Add</div>
                        <div class="add-row">
                            <button class="dock-btn primary" data-add="box" type="button">&#xFF0B; Cube</button>
                            <button class="dock-btn" data-add="cylinder" type="button" hidden>&#xFF0B; Cylinder</button>
                            <button class="dock-btn" data-add="sphere" type="button" hidden>&#xFF0B; Sphere</button>
                        </div>
                    </div>

                    <div class="ctl" data-group="group">
                        <div class="ctl-label">Back Unit</div>
                        <div class="add-row">
                            <button class="dock-btn" id="btn-group" type="button" disabled>Group pieces</button>
                        </div>
                    </div>

                    <div class="ctl" data-group="colour">
                        <div class="ctl-label">Colour</div>
                        <div id="swatches" class="swatches"></div>
                    </div>

                    <div class="ctl" data-group="attach">
                        <div class="ctl-label">Fit</div>
                        <div class="add-row">
                            <button class="dock-btn primary" id="btn-attach" type="button">Attach to Gizmobot</button>
                        </div>
                    </div>

                    <div class="ctl" data-group="save">
                        <div class="ctl-label">Take it with you</div>
                        <div class="add-row">
                            <button class="dock-btn primary" id="btn-save" type="button">Save Back Unit (.glb)</button>
                        </div>
                        <div id="save-status" role="status"></div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script type="importmap">{"imports":{
  "three":          "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
}}</script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
