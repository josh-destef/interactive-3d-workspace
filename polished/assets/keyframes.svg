<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img"
    aria-label="A rocket arcing over a timeline of keyframe diamonds, with the curve joining them">
    <defs>
        <radialGradient id="k-glow" cx="50%" cy="38%" r="65%">
            <stop offset="0%" stop-color="#243154" />
            <stop offset="100%" stop-color="#171e35" />
        </radialGradient>
    </defs>

    <rect width="800" height="520" fill="url(#k-glow)" />

    <!-- the interpolated path: what the computer invents between the stored poses -->
    <path d="M120 388C232 388 236 168 400 168s168 220 280 220" fill="none" stroke="#ff9022" stroke-width="3"
        stroke-opacity="0.85" />

    <!-- ghosts: the poses that were actually stored -->
    <g fill="none" stroke="#3a6fa8" stroke-opacity="0.42" stroke-width="2">
        <g transform="translate(120 388) rotate(-38) scale(0.82)">
            <path d="M0-42c14 14 14 44 0 58-14-14-14-44 0-58z" />
            <path d="M-13 6-24 26h11M13 6l11 20H13" />
        </g>
        <g transform="translate(680 388) rotate(38) scale(0.82)">
            <path d="M0-42c14 14 14 44 0 58-14-14-14-44 0-58z" />
            <path d="M-13 6-24 26h11M13 6l11 20H13" />
        </g>
    </g>

    <!-- the solid rocket sits at the top of the arc: a frame nobody stored -->
    <g transform="translate(400 168)">
        <path d="M0-58c19 19 19 60 0 79-19-19-19-60 0-79z" fill="#f1f1ec" />
        <path d="M0-58c11 12 16 30 16 44H-16c0-14 5-32 16-44z" fill="#ff9022" />
        <ellipse cx="0" cy="-4" rx="10" ry="10" fill="#3a6fa8" />
        <path d="M-18 8-33 34h15zM18 8l15 26H18z" fill="#c0453a" />
        <path d="M-9 26c4 14 14 22 9 34-5-12 5-20 9-34z" fill="#ffda22" fill-opacity="0.75" />
    </g>

    <!-- timeline -->
    <rect x="120" y="450" width="560" height="6" rx="3" fill="#ffffff" fill-opacity="0.12" />
    <rect x="120" y="450" width="280" height="6" rx="3" fill="#ff9022" fill-opacity="0.55" />

    <!-- stored keys -->
    <g fill="#ff9022" stroke="#171e35" stroke-width="2.5">
        <rect x="-9" y="-9" width="18" height="18" rx="2" transform="translate(120 453) rotate(45)" />
        <rect x="-9" y="-9" width="18" height="18" rx="2" transform="translate(400 453) rotate(45)" />
        <rect x="-9" y="-9" width="18" height="18" rx="2" transform="translate(680 453) rotate(45)" />
    </g>

    <!-- playhead, parked between two keys -->
    <path d="M400 418v52" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" />

    <g font-family="'DM Mono', monospace" font-size="15" fill="#8b95ab">
        <text x="112" y="492">F0</text>
        <text x="380" y="492">F50</text>
        <text x="656" y="492">F100</text>
        <text x="120" y="76" fill="#c3cad8" font-size="17">ease</text>
    </g>
</svg>
