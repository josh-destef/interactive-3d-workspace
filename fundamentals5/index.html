<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Navigating 3D Space — CreateAccess</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div id="app">
        <a href="../index.html" class="home-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
            </svg>
            <span>Home</span>
        </a>

        <img src="../LogoWText.png" alt="CreateAccess Logo" class="logo-top-right">

        <div id="util-bar">
            <button class="util-btn" id="btn-reset-view">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
                Reset View
            </button>
            <button class="util-btn" id="btn-reset-gizmo">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7" />
                    <path d="m16 20 2 2 4-4" />
                </svg>
                Reset Gizmo
            </button>
        </div>

        <!-- canvas window -->
        <div id="canvas-wrap">
            <canvas id="cv"></canvas>
            <div id="prog">
                <div id="prog-fill"></div>
            </div>
            <div id="hint"></div>
            <div id="status-badge">
                <span class="badge-dot"></span>
                <span class="badge-text">Watch</span>
            </div>
            <div id="badge-task"></div>
            <!-- loading overlay -->
            <div id="loading">loading gizmo...</div>

            <!-- demo cursor -->
            <div id="demo-cursor">
                <svg id="cursor-arrow" width="32" height="32" viewBox="0 0 24 24">
                    <path d="M4 4l15 6.5-6.5 2.5 2.5 6.5-3 3-3-7-4.5 4.5z" fill="#fff" stroke="#1a1a2e"
                        stroke-width="1.5" stroke-linejoin="round" />
                </svg>
                <div id="cursor-ring"></div>
                <!-- scroll icon -->
                <svg id="cursor-scroll" width="32" height="32" viewBox="0 0 24 24">
                    <rect x="7" y="4" width="10" height="16" rx="5" fill="#fff" stroke="#1a1a2e" stroke-width="2" />
                    <circle cx="12" cy="8" r="1.5" fill="#1a1a2e" />
                </svg>
            </div>
        </div>

        <!-- info panel -->
        <div id="panel">
            <div id="drag-handle">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>
            <div class="panel-header">
                <div id="cap-step"></div>
                <div id="cap-title"></div>
            </div>
            <div id="cap-body"></div>
            <div class="panel-footer">
                <div id="cap-prompt"></div>
                <div class="continue-side">
                    <a id="btn-finish" href="../index.html">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Back to Home
                    </a>
                    <button id="btn-continue">
                        Continue
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                            <path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <div id="kbd-hint"><kbd>Space</kbd> to continue</div>
                </div>
            </div>
        </div>

        <!-- free play widget -->
        <div id="free-play-widget">
            <button class="fp-btn active" data-mode="move">Move</button>
            <button class="fp-btn" data-mode="rotate">Rotate</button>
            <button class="fp-btn" data-mode="scale">Scale</button>
        </div>

    </div>

    <script type="importmap">{"imports":{
  "three":          "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
}}</script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
